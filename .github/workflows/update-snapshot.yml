name: Refresh shared Power BI snapshot

on:
  schedule:
    # Avoid the busiest start-of-hour queue while retaining a 15-minute poll.
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main
    paths:
      - "powerbi.js"
      - "scripts/update-snapshot.mjs"
      - ".github/workflows/update-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: receiving-dashboard-snapshot
  cancel-in-progress: false

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read Power BI and build partitioned snapshot
        run: node scripts/update-snapshot.mjs
      - name: Publish snapshot when changed
        run: |
          if git diff --quiet -- snapshot.json; then
            echo "Snapshot content is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          git commit -m "Refresh receiving dashboard snapshot"
          git push
