name: Refresh shared Power BI snapshot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: receiving-dashboard-snapshot
  cancel-in-progress: false

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read Power BI and build snapshot
        env:
          # A manual run always rebuilds; the schedule keeps the cheap early exit.
          FORCE_SNAPSHOT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/update-snapshot.mjs
      - name: Publish snapshot when changed
        run: |
          if git diff --quiet -- snapshot.json; then
            echo "Snapshot content is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          git commit -m "Refresh receiving dashboard snapshot"
          git push
