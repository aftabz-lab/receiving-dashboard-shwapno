name: Refresh snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Share the lock with the scheduled snapshot workflow so a manual refresh
  # cannot race its snapshot.json commit.
  group: receiving-dashboard-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read Power BI and build partitioned snapshot
        run: node scripts/update-snapshot.mjs

      - name: Publish snapshot when changed
        run: |
          if git diff --quiet -- snapshot.json; then
            echo "Snapshot content is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          git commit -m "Refresh receiving dashboard snapshot"
          git push
